services:
  - type: web
    name: santosh-portfolio-chat-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_CHAT_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_APP_TITLE
        value: Resume Chatbot
      - key: OPENAI_HTTP_REFERER
        value: https://www.santoshroy.info
      - key: CORS_ALLOW_ORIGINS
        value: https://www.santoshroy.info,https://santoshroy.info
      - key: RAG_TOP_K
        value: 4
